<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Art Display</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000; overflow: hidden;
    -webkit-user-select: none; user-select: none;
  }
  body.hide-cursor {
    cursor: none;
  }
  /* Two stacked <img> layers crossfade so image swaps never flash white. */
  .layer {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; background: #000;
    transition: opacity 1.2s ease-in-out; opacity: 0;
  }
  body.mode-contain .layer {
    object-fit: contain;
  }
  .layer.visible { opacity: 1; }
  #msg {
    position: absolute; inset: 0; display: flex;
    align-items: center; justify-content: center;
    color: #555; font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 20px; text-align: center; padding: 24px;
    pointer-events: none;
  }
  /* Mode toggle overlay hint (fades away on idle) */
  #fit-hint {
    position: absolute; bottom: 16px; right: 16px;
    background: rgba(0,0,0,0.6); color: #aaa;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 12px; padding: 6px 12px; border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.15);
    backdrop-filter: blur(4px);
    transition: opacity 0.4s;
    pointer-events: none;
    opacity: 0;
  }
  body:not(.hide-cursor) #fit-hint {
    opacity: 1;
  }
</style>
</head>
<body class="hide-cursor">
  <img id="a" class="layer" alt="" draggable="false">
  <img id="b" class="layer" alt="" draggable="false">
  <div id="msg">Loading…</div>
  <div id="fit-hint">Fill Screen (click to toggle)</div>

<script>
(function () {
  const imgA = document.getElementById('a');
  const imgB = document.getElementById('b');
  const msg = document.getElementById('msg');
  const fitHint = document.getElementById('fit-hint');
  const POLL_MS = 20000;        // how often to check for a new image
  const API = '/api/director/latest';

  let currentFile = null;        // filename currently displayed
  let active = imgA;             // the layer currently visible
  let fetching = false;

  // Fit mode toggle: cover (fill screen, default) vs contain (letterbox)
  let fitMode = localStorage.getItem('display_fit_mode') || 'cover';
  function updateFitMode() {
    if (fitMode === 'contain') {
      document.body.classList.add('mode-contain');
      fitHint.textContent = 'Fit Letterbox (click to fill)';
    } else {
      document.body.classList.remove('mode-contain');
      fitHint.textContent = 'Fill Screen (click to fit)';
    }
    localStorage.setItem('display_fit_mode', fitMode);
  }
  updateFitMode();

  document.body.addEventListener('click', () => {
    fitMode = (fitMode === 'cover') ? 'contain' : 'cover';
    updateFitMode();
  });

  // Cursor auto-hide on inactivity
  let cursorTimeout = null;
  function showCursor() {
    document.body.classList.remove('hide-cursor');
    clearTimeout(cursorTimeout);
    cursorTimeout = setTimeout(() => {
      document.body.classList.add('hide-cursor');
    }, 2500);
  }
  window.addEventListener('mousemove', showCursor);

  function hide(el) { el.classList.remove('visible'); }
  function show(el) { el.classList.add('visible'); }

  async function loadLatest() {
    if (fetching) return;
    fetching = true;
    try {
      const resp = await fetch(API, { cache: 'no-store' });
      const data = await resp.json();
      if (!data || !data.url) {
        msg.style.display = 'flex';
        msg.textContent = 'No image yet';
        fetching = false;
        return;
      }
      // Nothing new — leave the current image on screen.
      if (data.file && data.file === currentFile) {
        fetching = false;
        return;
      }
      // Preload the new image into the hidden layer, then crossfade.
      const next = (active === imgA) ? imgB : imgA;
      await new Promise((resolve, reject) => {
        next.onload = resolve;
        next.onerror = reject;
        next.src = data.url;
      });
      hide(active);
      show(next);
      active = next;
      currentFile = data.file;
      msg.style.display = 'none';
    } catch (e) {
      // Transient failure — keep showing whatever is on screen; retry next poll.
      msg.style.display = 'flex';
      msg.textContent = 'Waiting for connection…';
    }
    fetching = false;
  }

  // Kick off immediately, then poll.
  loadLatest();
  setInterval(loadLatest, POLL_MS);

  // Wake the poll up if the tab was backgrounded (e.g. TV sleeps/wakes).
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) loadLatest();
  });
})();
</script>
</body>
</html>
