<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Art Display</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%;-height: 100%;
    background: #000; overflow: hidden;
    -webkit-user-select: none; user-select: none;
  }
  body.hide-cursor {
    cursor: none;
  }
  /* Two stacked <img> layers crossfade so image swaps never flash white. */
  .layer {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; background: #000;
    transition: opacity 1.2s ease-in-out; opacity: 0;
  }
  body.mode-contain .layer {
    object-fit: contain;
  }
  .layer.visible { opacity: 1; }
  #msg {
    position: absolute; inset: 0; display: flex;
    align-items: center; justify-content: center;
    color: #555; font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 20px; text-align: center; padding: 24px;
    pointer-events: none;
  }
  /* Controls overlay (fades away on idle) */
  #controls {
    position: absolute; bottom: 16px; right: 16px;
    display: flex; gap: 8px;
    transition: opacity 0.4s;
    opacity: 0;
    z-index: 10;
  }
  body:not(.hide-cursor) #controls {
    opacity: 1;
  }
  .btn {
    background: rgba(0,0,0,0.65); color: #ccc;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 12px; padding: 6px 12px; border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.2);
    backdrop-filter: blur(6px);
    cursor: pointer; outline: none;
    transition: background 0.2s, color 0.2s;
  }
  .btn:hover {
    background: rgba(255,255,255,0.2);
    color: #fff;
  }
</style>
</head>
<body class="hide-cursor">
  <img id="a" class="layer" alt="" draggable="false">
  <img id="b" class="layer" alt="" draggable="false">
  <div id="msg">Loading…</div>
  <div id="controls">
    <button id="btn-fit" class="btn">Fit / Fill</button>
    <button id="btn-fs" class="btn">Full Screen (F11)</button>
  </div>

<script>
(function () {
  const imgA = document.getElementById('a');
  const imgB = document.getElementById('b');
  const msg = document.getElementById('msg');
  const btnFit = document.getElementById('btn-fit');
  const btnFs = document.getElementById('btn-fs');
  const POLL_MS = 20000;        // how often to check for a new image
  const API = '/api/director/latest';

  let currentFile = null;        // filename currently displayed
  let active = imgA;             // the layer currently visible
  let fetching = false;

  // Fit mode toggle: cover (fill screen, default) vs contain (letterbox)
  let fitMode = localStorage.getItem('display_fit_mode') || 'cover';
  function updateFitMode() {
    if (fitMode === 'contain') {
      document.body.classList.add('mode-contain');
      btnFit.textContent = 'Mode: Fit Letterbox';
    } else {
      document.body.classList.remove('mode-contain');
      btnFit.textContent = 'Mode: Fill Screen';
    }
    localStorage.setItem('display_fit_mode', fitMode);
  }
  updateFitMode();

  btnFit.addEventListener('click', (e) => {
    e.stopPropagation();
    fitMode = (fitMode === 'cover') ? 'contain' : 'cover';
    updateFitMode();
  });

  // Fullscreen API toggle
  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => {});
    } else {
      if (document.exitFullscreen) {
        document.exitFullscreen().catch(() => {});
      }
    }
  }

  function updateFullscreenBtn() {
    if (document.fullscreenElement) {
      btnFs.textContent = 'Exit Fullscreen';
    } else {
      btnFs.textContent = 'Full Screen (F11)';
    }
  }

  btnFs.addEventListener('click', (e) => {
    e.stopPropagation();
    toggleFullscreen();
  });

  document.addEventListener('fullscreenchange', updateFullscreenBtn);

  // Clicking background or double-clicking anywhere toggles fullscreen or fit
  document.body.addEventListener('dblclick', toggleFullscreen);
  document.body.addEventListener('click', (e) => {
    if (e.target.tagName === 'BUTTON') return;
    // On mobile / touch tap, if not fullscreen, try requesting fullscreen or toggle fit
    fitMode = (fitMode === 'cover') ? 'contain' : 'cover';
    updateFitMode();
  });

  // Keyboard shortcuts: 'F' for Fullscreen, 'M' for Mode
  window.addEventListener('keydown', (e) => {
    if (e.key === 'f' || e.key === 'F') {
      toggleFullscreen();
    } else if (e.key === 'm' || e.key === 'M') {
      fitMode = (fitMode === 'cover') ? 'contain' : 'cover';
      updateFitMode();
    }
  });

  // Cursor auto-hide on inactivity
  let cursorTimeout = null;
  function showCursor() {
    document.body.classList.remove('hide-cursor');
    clearTimeout(cursorTimeout);
    cursorTimeout = setTimeout(() => {
      document.body.classList.add('hide-cursor');
    }, 2500);
  }
  window.addEventListener('mousemove', showCursor);

  function hide(el) { el.classList.remove('visible'); }
  function show(el) { el.classList.add('visible'); }


  async function loadLatest() {
    if (fetching) return;
    fetching = true;
    try {
      const resp = await fetch(API, { cache: 'no-store' });
      const data = await resp.json();
      if (!data || !data.url) {
        msg.style.display = 'flex';
        msg.textContent = 'No image yet';
        fetching = false;
        return;
      }
      // Nothing new — leave the current image on screen.
      if (data.file && data.file === currentFile) {
        fetching = false;
        return;
      }
      // Preload the new image into the hidden layer, then crossfade.
      const next = (active === imgA) ? imgB : imgA;
      await new Promise((resolve, reject) => {
        next.onload = resolve;
        next.onerror = reject;
        next.src = data.url;
      });
      hide(active);
      show(next);
      active = next;
      currentFile = data.file;
      msg.style.display = 'none';
    } catch (e) {
      // Transient failure — keep showing whatever is on screen; retry next poll.
      msg.style.display = 'flex';
      msg.textContent = 'Waiting for connection…';
    }
    fetching = false;
  }

  // Kick off immediately, then poll.
  loadLatest();
  setInterval(loadLatest, POLL_MS);

  // Wake the poll up if the tab was backgrounded (e.g. TV sleeps/wakes).
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) loadLatest();
  });
})();
</script>
</body>
</html>
